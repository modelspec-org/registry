# Tests of the notification (scripts/notify-sites.mjs and .github/workflows/notify-sites.yml): offline, no
# secret, nothing is sent.
name: Test the site notification

on:
  push:
    branches: [main]
    paths:
      - scripts/notify-sites.*
      - scripts/test-notify-sites.mjs
      - .github/workflows/notify-sites*.yml
  pull_request:
    paths:
      - scripts/notify-sites.*
      - scripts/test-notify-sites.mjs
      - .github/workflows/notify-sites*.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node --test scripts/test-notify-sites.mjs
