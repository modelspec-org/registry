title: ECB daily native reference quote model
description: >-
  Preparatory model of ECB daily XML decoder output: FxReferenceQuote retains
  native required time, currency and rate strings and declares no stable key.
  EUR base and indicative-reference kind are source-definition context, without
  an invented base field or EUR quote row. Date/currency grain is scoped to one
  returned response; observation identities distinguish republications. Decimal
  digits and trailing zeros remain lexical. CC0 covers authored model metadata
  only; source execution, retention and paid applicability are not admitted.
