title: GeoNames source projection
description: >-
  Source-faithful model for four logical GeoNames recordsets: countries,
  places, admin1 and alternate names. Native text fields, keys and unresolved
  references remain available; auxiliary demo country bridge entities retain
  separate source property scopes. Model metadata is CC0-1.0; source data is
  CC-BY-4.0. Registration alone does not authorize raw-label interoperability.
